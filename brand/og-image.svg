<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="45%" r="55%">
      <stop offset="0" stop-color="#b8e07a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b8e07a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f1a14"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- a walk: dotted path with stops -->
  <path d="M-20 585 C 220 520, 420 610, 640 545 S 960 470, 1220 520" stroke="#b8e07a" stroke-opacity=".35" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" fill="none"/>
  <g fill="#b8e07a" fill-opacity=".55">
    <circle cx="300" cy="566" r="7"/><circle cx="640" cy="545" r="7"/><circle cx="1000" cy="497" r="7"/>
  </g>

  <!-- brand -->
  <g transform="translate(80 70) scale(0.11)">
    <rect width="512" height="512" rx="112" fill="#16241c"/>
    <g transform="translate(15.5 42.5) scale(6.5)" fill="#b8e07a">
      <path d="M20 37 L11 19 Q14 16 17 18 L26 32 Z"/><ellipse cx="31" cy="38" rx="14" ry="10.5"/><circle cx="41" cy="28" r="7.5"/><path d="M47.5 26.5 L55 28.5 L47.5 30.5 Z"/>
    </g>
    <g stroke="#b8e07a" stroke-width="18" stroke-linecap="round" fill="none"><path d="M407.5 199 A45 45 0 0 1 407.5 257"/><path d="M434.3 176.6 A80 80 0 0 1 434.3 279.4" opacity=".6"/></g>
  </g>
  <text x="152" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#b8e07a">Earshot</text>

  <!-- headline -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#edf2ea">
    <text x="80" y="245" font-size="62">Put your phone away.</text>
    <text x="80" y="320" font-size="50" fill="#cfd8cc">Wren will tell you what</text>
    <text x="80" y="382" font-size="50" fill="#cfd8cc">you're walking past.</text>
  </g>
  <text x="80" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#9aac9d">Free  ·  Works with no signal  ·  Private, runs on your phone</text>

  <!-- Wren -->
  <g transform="translate(830 150)">
    <circle cx="160" cy="160" r="160" fill="#b8e07a"/>
    <g transform="scale(5)">
      <g fill="#1d2e17">
        <path d="M20 37 L11 19 Q14 16 17 18 L26 32 Z"/><ellipse cx="31" cy="38" rx="14" ry="10.5"/><circle cx="41" cy="28" r="7.5"/><path d="M47.5 26.5 L55 28.5 L47.5 30.5 Z"/>
      </g>
      <circle cx="43" cy="26.5" r="1.6" fill="#b8e07a"/>
      <path d="M24 37 Q31 42 38 36" stroke="#b8e07a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".55"/>
      <path d="M28 48 L27 53 M34 48 L35 53" stroke="#1d2e17" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
